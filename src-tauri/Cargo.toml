[workspace]
members = [".", "crates/game-core"]
resolver = "2"

[package]
name = "openworld"
version = "0.1.0"
description = "Open world game built with Rust and Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "openworld_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
game-core = { path = "crates/game-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
